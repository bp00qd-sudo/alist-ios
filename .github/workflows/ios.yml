name: iOS build probe

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20250106192035-c31d5b91ecc3
          gomobile init
      - name: Fetch web distribution
        run: ./scripts/fetch-web-dist.sh
      - name: Build arm64 XCFramework
        run: ./scripts/build-ios.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alist-ios-build
          path: |
            build/AlistCore.xcframework
            build/ios-driver-compatibility.txt
            build/ios-m1cpu-why.txt
          if-no-files-found: ignore
